[tool.poetry]
name = "aws-iot-data-platform"
version = "0.1.0"
description = "Production-grade AWS IoT data platform using PySpark"
authors = ["Dalitso"]
readme = "README.md"
packages = [
    {include = "iot_platform", from = "src"},
    {include = "jobs"},
]

[tool.poetry.dependencies]
python = "^3.11"
pyspark = "^3.5"
boto3 = "^1.34"
pydantic = "^2.0"
pyyaml = "^6.0"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
chispa = "^0.10"
hypothesis = "^6.0"
ruff = "^0.6"
mypy = "^1.10"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
